name: Release

# Runs when you push a tag that starts with "v" (v1.0, v2.1, ...)
# or by hand: Actions > Release > Run workflow (no release is published then,
# but the files are downloadable from the run page under "Artifacts").
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0   # keep in sync with the KiCad version you use
      options: --user root
    env:
      MFR_FIELD: 'Mfr. No'      # name of the part number field on your symbols
      STRICT: '1'               # 1 = fail when a part has no part number, 0 = warn only
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y zip python3

      - name: Export
        run: bash .github/scripts/export.sh release out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: out/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*
          generate_release_notes: true
