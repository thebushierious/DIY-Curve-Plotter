name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root
    env:
      MFR_FIELD: 'Mfr. No'
      STRICT: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y zip

      - name: Export
        run: bash .github/scripts/export.sh release out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: out/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: out/*
          generate_release_notes: true