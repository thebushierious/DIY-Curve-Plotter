name: Docs

# Regenerates docs/generated/ (schematic PDF, board drawings) and commits it back.
# Runs when KiCad files or the export scripts change on main, or by hand:
# Actions > Docs > Run workflow.
on:
  push:
    branches: [main]
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
      - '.github/scripts/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0   # keep in sync with release.yml
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y git python3 python3-pip inkscape
          pip install --break-system-packages pcbdraw || echo "::warning::PcbDraw could not be installed, board drawings are skipped"

      - name: Generate
        run: bash .github/scripts/export.sh docs docs/generated

      - name: Commit changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add -A docs/generated
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Update generated docs"
            git push
          fi
